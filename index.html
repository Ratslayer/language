<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Reader</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <button id="openSettings" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" disabled><span aria-hidden="true">⚙&#xFE0E;</span></button>
  <section id="shelf" aria-labelledby="shelfTitle">
    <header class="shelfHeading"><h1 id="shelfTitle">Books</h1>
      <label class="shelfLanguage">I speak <select id="shelfTarget" disabled><option value="en">English</option></select></label>
    </header>
    <p id="shelfStatus" role="status">Loading books…</p>
    <div id="bookGrid" aria-label="Book catalogue"></div>
    <div class="shelfControls">
      <button id="refreshBooks" disabled>Refresh</button>
      <button id="importBook" disabled>Open local file…</button>
    </div>
  </section>
  <section id="fileTools" aria-label="Local files" hidden>
    <header><h1>Local files</h1><button id="open" disabled>Open .txt file</button></header>
    <input id="file" type="file" accept=".txt,text/plain" hidden>
    <section class="languages" aria-label="Languages">
      <label>Reading in <select id="source"></select></label>
      <label>Translate to <select id="target"></select></label>
    </section>
    <div id="packTools" hidden><button id="packOpen">Open book or language file</button>
      <details id="packActions" hidden><summary>Offline files</summary>
        <button id="prepare">Prepare this page</button>
        <button id="exportLang">Save language file…</button>
        <button id="exportBook">Save book file…</button>
      </details>
    </div>
    <p id="fileStatus" role="status"></p>
  </section>
  <section id="reader" aria-labelledby="title" hidden>
    <h1 id="title" class="readingTitle" tabindex="-1"></h1>
    <p id="progress" role="status" hidden></p>
    <p id="status" role="status"></p>
    <article id="passage" class="readingPassage" dir="auto" aria-label="Reading text"></article>
    <nav hidden><button id="prev">Previous</button><span id="count"></span><button id="next">Next</button></nav>
  </section>
</main>
<span id="popup" role="region" lang="en" dir="ltr" aria-label="Selection details" hidden>
  <span class="translationHeading">
    <button id="pronounce" type="button" aria-label="Pronounce word" title="Pronounce word" hidden>🔊</button>
    <button id="markSelection" type="button" aria-label="Bookmark word" aria-pressed="false"><svg aria-hidden="true" width="18" height="22" viewBox="0 0 18 22"><path d="M3 2h12v17l-6-4-6 4z" stroke="currentColor" stroke-width="2"/></svg></button>
    <button id="sentence" type="button">Sentence</button>
    <button id="rules" type="button" aria-haspopup="dialog" hidden>Rules</button>
    <button id="close" aria-label="Close selection details">×</button>
  </span>
  <span id="speechStatus" role="status"></span>
  <button id="installVoice" type="button" hidden></button>
  <span id="answer" role="status"><span id="meaning" dir="auto"></span><span id="wordDetails" hidden>
<strong id="word" dir="auto"></strong> <em id="grammarLabel" lang="en"></em> <small id="grammarSource"></small></span></span>
</span>
<div id="pagePreview" inert aria-hidden="true" hidden><div class="readingColumn"></div></div>
<section id="readerNavigation" aria-label="Reading controls" aria-keyshortcuts="Alt+ArrowDown" inert>
  <div class="navigationControls">
    <div class="navigationHeader">
      <form id="pageJump">
        <label for="pageNumber">Page</label>
        <input id="pageNumber" type="number" inputmode="numeric" enterkeyhint="go" min="1" step="1" required autocomplete="off">
        <span id="pageTotal"></span>
        <button type="submit">Go</button>
      </form>
      <button id="navigationClose" type="button">Back</button>
    </div>
    <button id="readingVersion" type="button" hidden></button>
  </div>
  <details id="chapterSection" hidden>
    <summary>Chapters</summary>
    <div id="chapterList"></div>
  </details>
  <details id="bookmarkSection">
    <summary>Bookmarks</summary>
    <div id="bookmarkList"></div>
  </details>
</section>
<dialog id="settingsDialog" class="readerDialog" aria-labelledby="settingsTitle">
  <header><h2 id="settingsTitle">Settings</h2><button id="closeSettings" type="button" aria-label="Close settings" autofocus>×</button></header>
  <details id="experiments">
    <summary>Experiments</summary>
    <label for="grammarFallback"><input id="grammarFallback" type="checkbox"> <span id="grammarFallbackLabel">Fallback to LLM when grammar is missing</span></label>
  </details>
</dialog>
<dialog id="grammarDialog" class="readerDialog" aria-labelledby="grammarTitle">
  <header><h2 id="grammarTitle" lang="en"></h2><button id="closeRules" type="button" aria-label="Close rules" autofocus>×</button></header>
  <p id="ruleLabel"></p>
  <p id="ruleNote" role="status"></p>
  <details id="originalGrammar" hidden><summary>Пояснение на английском</summary><p lang="en"></p></details>
  <button id="retryRules" type="button" hidden>Retry grammar lookup</button>
  <label id="tenseControl" hidden><span id="verbFormLabel">Verb form</span> <select id="grammarTense"></select></label>
  <table id="grammarTable" aria-label="Word forms" hidden><tbody></tbody></table>
</dialog>
<dialog id="imageViewer" aria-label="Illustration viewer">
  <canvas role="img"></canvas>
  <div class="imageControls" role="group" aria-label="Image controls">
    <button type="button" data-out aria-label="Zoom out">−</button>
    <button type="button" data-fit>Fit</button>
    <button type="button" data-in aria-label="Zoom in">+</button>
    <button type="button" data-close autofocus aria-label="Close image">×</button>
  </div>
</dialog>
</body></html>
